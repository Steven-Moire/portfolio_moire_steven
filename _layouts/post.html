---
layout: default
---

<script>
/* Set lang before content renders — prevents flash of wrong language */
(function () { document.documentElement.dataset.lang = localStorage.getItem('portfolio-lang') || 'en'; })();
</script>

<article>
  <!-- No layout-level title: each post carries its own heading in each language block -->
  <p>{{ page.date | date: "%B %d, %Y" }}</p>
  {{ content }}
</article>
